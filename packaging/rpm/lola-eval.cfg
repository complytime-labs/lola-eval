# Mock configuration for lola-eval RPM builds
# Extends centos-stream-10-x86_64 with project-specific build deps.

config_opts['root'] = 'lola-eval-{{ target_arch }}'
config_opts['target_arch'] = 'x86_64'
config_opts['dist'] = 'el10'
config_opts['releasever'] = '10'
config_opts['package_manager'] = 'dnf'

# Use direct chroot (faster than bootstrap image)
config_opts['use_bootstrap_image'] = False

# Install build dependencies in chroot
# rpm-build: rpmbuild command
# python3, python3-pip: build wheel, needed by %build before bundled Python is ready
# curl: download tarballs in %prep
# xz, tar, gzip: extract tarballs
config_opts['chroot_setup_cmd'] = 'install centos-stream-release rpm-build python3 python3-pip curl xz tar gzip'

# Enable networking in rpmbuild (required for %prep to download tarballs)
config_opts['rpmbuild_networking'] = True

# Use host's DNS resolution for downloads
config_opts['use_host_resolv'] = True

# Inherit base config from system centos-stream-10-x86_64
# This pulls in yum repos, GPG keys, etc.
config_opts['dnf.conf'] = """
[main]
keepcache=1
debuglevel=2
reposdir=/dev/null
logfile=/var/log/yum.log
retries=20
obsoletes=1
gpgcheck=0
assumeyes=1
syslog_ident=mock
syslog_device=
metadata_expire=0
mdpolicy=group:primary
best=1

[baseos]
name=CentOS Stream 10 - BaseOS
baseurl=http://mirror.stream.centos.org/10-stream/BaseOS/x86_64/os/
gpgcheck=0
enabled=1

[appstream]
name=CentOS Stream 10 - AppStream
baseurl=http://mirror.stream.centos.org/10-stream/AppStream/x86_64/os/
gpgcheck=0
enabled=1

[crb]
name=CentOS Stream 10 - CRB
baseurl=http://mirror.stream.centos.org/10-stream/CRB/x86_64/os/
gpgcheck=0
enabled=1
"""
