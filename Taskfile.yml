version: '3'

# Use .venv/bin/python directly (instead of `uv run …`) for test/lint
# commands. `uv run` will silently fall back to system Python if the
# venv is broken or out-of-date, masking ImportErrors as confusing
# "No module named lola_eval" failures. Hard-pinning to the venv makes
# missing/stale install fail loud, which is what we want.

vars:
  VENV_PY: '{{.TASKFILE_DIR}}/.venv/bin/python'

tasks:
  default:
    desc: List recipes
    cmds: [task --list]

  setup:
    desc: Install Python and Node dependencies (wipes .venv for predictability)
    cmds:
      # Wipe the existing venv first. Editable installs hard-pin the source
      # path; a venv created at one repo location does not work after `git
      # mv` or cloning to a different machine. Cheap insurance.
      - rm -rf .venv
      - uv sync --extra dev
      # Preflight: verify lola_eval imports cleanly. If this fails, the
      # editable install did not land — surfaces the real error here
      # instead of letting `task test` produce a confusing import trace.
      - '{{.VENV_PY}} -c "import lola_eval; print(f''lola_eval ok at {lola_eval.__file__}'')"'
      - npm install

  lint:
    desc: Lint Python and JS
    cmds:
      - '{{.VENV_PY}} -m ruff check src tests/python'
      - npx eslint src/lola_eval/_data/providers tests/node || true

  fmt:
    desc: Format Python and JS
    cmds:
      - '{{.VENV_PY}} -m ruff format src tests/python'
      - npx prettier --write src/lola_eval/_data/providers tests/node || true

  test:unit:
    desc: Run Python unit tests
    cmds:
      - '{{.VENV_PY}} -m pytest tests/python -v'

  test:integration:
    desc: Run integration tests (fake CLIs)
    cmds:
      - '{{.VENV_PY}} -m pytest tests/integration -v -m integration'

  test:
    desc: Run unit + integration + JS + bats + docs tests
    cmds:
      - '{{.VENV_PY}} -m pytest'
      - npm test
      - bats tests/bats
      - task: docs:verify

  sandbox:verify:
    desc: Live proof the bubblewrap sandbox hides host opencode config from REAL opencode (needs opencode + strace + bwrap; skipped by the default suite)
    cmds:
      - LOLA_SANDBOX_LIVE=1 bats tests/bats/sandbox_isolation.bats

  build:wheel:
    desc: Build the lola-eval wheel
    cmds:
      # Clear prior wheels so `dist/` only holds the current version.
      # `python -m build` does not prune older artifacts on its own.
      - rm -f dist/*.whl
      - '{{.VENV_PY}} -m build --wheel'

  package:rpm:
    desc: Build the lola-eval RPM via Mock
    # Skip the (5+ min mock) rebuild when an RPM already exists in dist/.
    # Source-tracking proved too fragile across machines; force a rebuild
    # with `task package:rpm:clean && task package:rpm`.
    status:
      - ls dist/lola-eval-*.rpm >/dev/null 2>&1
    cmds:
      # Preflight check
      - |
        if ! command -v mock >/dev/null 2>&1; then
          echo "Mock not found. Install with:"
          echo "  sudo dnf install mock"
          echo "  sudo usermod -a -G mock \$USER"
          echo "  (logout/login required for group membership)"
          exit 127
        fi
      # Build with Mock (copy sources, run rpmbuild in chroot, extract RPM)
      - mock -r packaging/rpm/lola-eval.cfg --init
      - mock -r packaging/rpm/lola-eval.cfg --copyin src /builddir/build/SOURCES/
      - mock -r packaging/rpm/lola-eval.cfg --copyin pyproject.toml /builddir/build/SOURCES/
      - mock -r packaging/rpm/lola-eval.cfg --copyin README.md /builddir/build/SOURCES/
      - mock -r packaging/rpm/lola-eval.cfg --copyin LICENSE /builddir/build/SOURCES/
      - mock -r packaging/rpm/lola-eval.cfg --copyin docs /builddir/build/SOURCES/
      # Stage examples/ to a temp dir, stripped of developer-local state, before
      # copyin. `mock --copyin` reads the working tree (not the git index), so
      # without filtering we ship node_modules/, runs.db, reports/, __pycache__/,
      # .venv/, etc. from whatever the maintainer happened to have on disk.
      # See `package:rpm:hermetic-check` for the post-install assertion.
      - |
        set -euo pipefail
        stage="$(mktemp -d)"
        trap 'rm -rf "$stage"' EXIT
        rsync -a \
          --exclude='node_modules/' \
          --exclude='__pycache__/' \
          --exclude='.lola-eval/out/' \
          --exclude='.venv/' \
          --exclude='dist/' \
          --exclude='build/' \
          --exclude='.pytest_cache/' \
          --exclude='.ruff_cache/' \
          --exclude='*.pyc' \
          --exclude='.DS_Store' \
          examples/ "$stage/examples/"
        mock -r packaging/rpm/lola-eval.cfg --copyin "$stage/examples" /builddir/build/SOURCES/
      - mock -r packaging/rpm/lola-eval.cfg --copyin packaging/rpm/lola-eval.spec /builddir/build/SPECS/lola-eval.spec
      - |
        set -euo pipefail
        version="$('{{.VENV_PY}}' -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
        mock -r packaging/rpm/lola-eval.cfg --no-clean --shell "cd /builddir/build && rpmbuild -bb --define \"_topdir /builddir/build\" --define \"version $version\" SPECS/lola-eval.spec"
      - rm -rf RPMS
      - mock -r packaging/rpm/lola-eval.cfg --copyout /builddir/build/RPMS RPMS
      - mkdir -p dist
      - find RPMS -name '*.rpm' -exec mv {} dist/ \;
      - rm -rf RPMS

  package:rpm:clean:
    desc: Remove Mock build artifacts and chroot
    cmds:
      - mock -r packaging/rpm/lola-eval.cfg --clean 2>/dev/null || true
      - rm -rf dist/*.rpm

  package:rpm:hermetic-check:
    desc: Assert the built RPM contains no developer-local state
    deps: [package:rpm]
    cmds:
      # The Mock build pipeline copies the maintainer's working tree, not the
      # git index. Filtering happens at copyin time (see `package:rpm`); this
      # gate verifies the filter held. Any of these paths inside the RPM is a
      # release-hygiene bug.
      - |
        set -euo pipefail
        rpm="$(ls dist/lola-eval-*.rpm | head -n1)"
        bad="$(rpm -qlp "$rpm" 2>/dev/null | grep -E \
          -e '/share/examples/.*/node_modules(/|$)' \
          -e '/share/examples/.*/__pycache__(/|$)' \
          -e '/share/examples/.*/\.lola-eval/out(/|$)' \
          -e '/share/examples/.*/\.venv(/|$)' \
          -e '/share/examples/.*/\.pytest_cache(/|$)' \
          -e '/_data/.*/__pycache__(/|$)' \
          || true)"
        if [ -n "$bad" ]; then
          echo "hermetic-check FAILED: developer-local state leaked into $rpm"
          echo "$bad"
          exit 1
        fi
        echo "hermetic-check OK: $rpm contains no node_modules/__pycache__/.lola-eval/out/.venv state"

  package:rpm:smoke:
    desc: Install built RPM in clean container; run lola-eval doctor
    deps: [package:rpm, package:rpm:hermetic-check]
    cmds:
      # The smoke container is bare CentOS Stream 10 with no lola. The
      # RPM spec deliberately does NOT Requires: lola (no upstream lola
      # RPM exists yet), so doctor expectedly flags `[!!] lola not found`
      # and exits non-zero. That single failure is benign for an RPM
      # smoke gate; every OTHER doctor problem (broken bundle, Node /
      # promptfoo engines mismatch, missing versions.txt, fixture bugs)
      # IS a release blocker and must fail the gate. Inspect the output
      # to distinguish the two cases.
      - |
        podman run --rm -v "$(pwd)/dist:/dist:Z" quay.io/centos/centos:stream10 \
          bash -c '
            set -o pipefail
            rpm -ivh --nodeps /dist/lola-eval-*.rpm
            out=$(lola-eval doctor 2>&1)
            rc=$?
            echo "$out"
            if [ $rc -eq 0 ]; then
              exit 0
            fi
            # Doctor reported a problem. Accept it only if the single
            # [!!] line is the expected "lola not found".
            total=$(printf "%s\n" "$out" | grep -c "\[!!\]" || true)
            lola=$(printf "%s\n" "$out" | grep -c "\[!!\] lola" || true)
            if [ "$total" = "1" ] && [ "$lola" = "1" ]; then
              echo
              echo "smoke OK: only expected failure is missing lola (install: uv tool install lola-ai)"
              exit 0
            fi
            echo
            echo "smoke FAILED: doctor reported unexpected problems (see output above)"
            exit 1
          '

  test:integration:container:build:
    desc: Build the container image for end-to-end integration tests
    vars:
      IMAGE_NAME: lola-eval-integration-test
    cmds:
      - podman build -t {{.IMAGE_NAME}} -f tests/container/Containerfile .

  test:integration:container:
    desc: "Run end-to-end tests in a podman container with real CLIs (builds image if missing)"
    prompt: "This will make live API calls using your real credentials and incur costs. Continue?"
    vars:
      IMAGE_NAME: lola-eval-integration-test
    cmds:
      - |
        # Build only if the image doesn't already exist.
        if ! podman image exists {{.IMAGE_NAME}}; then
          echo "Image {{.IMAGE_NAME}} not found — building..."
          podman build -t {{.IMAGE_NAME}} -f tests/container/Containerfile .
        else
          echo "Using existing image {{.IMAGE_NAME}}"
          echo "  (run 'task test:integration:container:build' to rebuild)"
        fi
      - |
        # Pass all ANTHROPIC_*, GOOGLE_*, VERTEX_* env vars into the container.
        # Also pass CLAUDE_CODE_USE_VERTEX (but not other CLAUDE_CODE_* vars
        # which leak the host session's paths and IDs into the container).
        env_flags=""
        for var in $(env | grep -oP '^(ANTHROPIC_|GOOGLE_|VERTEX_)\w+' | sort -u); do
          env_flags="$env_flags -e $var"
        done
        [[ -n "${CLAUDE_CODE_USE_VERTEX:-}" ]] && env_flags="$env_flags -e CLAUDE_CODE_USE_VERTEX"

        # Bridge GOOGLE_CLOUD_PROJECT from ANTHROPIC_VERTEX_PROJECT_ID if needed.
        if [[ -z "${GOOGLE_CLOUD_PROJECT:-}" ]] && [[ -n "${ANTHROPIC_VERTEX_PROJECT_ID:-}" ]]; then
          env_flags="$env_flags -e GOOGLE_CLOUD_PROJECT=$ANTHROPIC_VERTEX_PROJECT_ID"
        fi

        if [[ -z "$env_flags" ]]; then
          echo "ERROR: No ANTHROPIC_*/GOOGLE_*/VERTEX_* env vars found."
          echo "Set at least ANTHROPIC_API_KEY or the Vertex credentials."
          exit 1
        fi

        # Mount Google ADC credentials for Vertex AI authentication.
        # Rootless podman maps the host UID to root inside the container,
        # so a bind-mounted file owned by us appears as root:root — the
        # container's testuser (UID 1000) can't read it.  Fix: copy to a
        # temp file and `podman unshare chown 1000:1000` so it maps to
        # testuser inside the container, keeping 600 permissions throughout.
        run_flags="--security-opt label=disable"
        adc_path="${GOOGLE_APPLICATION_CREDENTIALS:-$HOME/.config/gcloud/application_default_credentials.json}"
        adc_tmp=""
        if [[ -f "$adc_path" ]]; then
          adc_tmp="$(mktemp)"
          cp "$adc_path" "$adc_tmp"
          podman unshare chown 1000:1000 "$adc_tmp"
          container_adc="/home/testuser/.config/gcloud/application_default_credentials.json"
          run_flags="$run_flags -v ${adc_tmp}:${container_adc}:ro"
          env_flags="$env_flags -e GOOGLE_APPLICATION_CREDENTIALS=$container_adc"
        fi

        podman run --rm $run_flags $env_flags {{.IMAGE_NAME}}
        rc=$?
        [[ -n "$adc_tmp" ]] && rm -f "$adc_tmp"
        exit $rc

  smoke:
    desc: "Opt-in: run lola-eval test against examples/default (requires real claude CLI)"
    cmds:
      - cd examples/default && {{.VENV_PY}} -m lola_eval test

  # test:live runs the example case suite against the REAL claude-code CLI
  # (bug-fix, code-review, ts-npm, project-skill), then asserts the
  # framework's structural invariants over the resulting runs.db (judge
  # completed, provenance recorded, diffs hermetic, successful rows scored).
  test:live:
    desc: "Opt-in: run the real claude-code matrix over examples/default + assert invariants (costs money)"
    prompt: "This runs the live claude-code matrix (real API calls, real cost). Continue?"
    cmds:
      - "{{.VENV_PY}} -m lola_eval test --config examples/default/.lola-eval/config.live.yaml"
      - "{{.VENV_PY}} tests/live/check_invariants.py examples/default/.lola-eval/out"

  # test:profiles runs the skill-conflict sweep (case-greeting across the
  # none/greet/greet-farewell/greet-salute/greet-farewell-salute profiles),
  # asserts framework invariants AND that every profile produced a row, then
  # renders the per-profile composite deltas + any detected conflicts.
  test:profiles:
    desc: "Opt-in: run the skill-conflict profile sweep + assert invariants + render conflicts (costs money)"
    prompt: "This runs the live claude-code profile sweep (real API calls, real cost). Continue?"
    cmds:
      - "{{.VENV_PY}} -m lola_eval test --config examples/conflict/.lola-eval/config.yaml"
      - "{{.VENV_PY}} tests/live/check_invariants.py examples/conflict/.lola-eval/out --expect-profiles none,greet,greet-farewell,greet-salute,greet-farewell-salute"
      - "{{.VENV_PY}} -m lola_eval profile-compare --config examples/conflict/.lola-eval/config.yaml"

  pricing:update:
    desc: "Refresh src/lola_eval/_data/pricing/models.json from models.dev (with attestation)"
    cmds:
      - |
        set -euo pipefail
        target="src/lola_eval/_data/pricing/models.json"
        tmp="$(mktemp)"
        trap 'rm -f "$tmp"' EXIT
        echo "[pricing:update] fetching https://models.dev/api.json"
        curl -fsSL https://models.dev/api.json -o "$tmp"
        # Sanity: must be valid JSON with anthropic provider present.
        '{{.VENV_PY}}' -c "import json,sys; d=json.load(open('$tmp')); sys.exit(0 if 'anthropic' in d and d['anthropic'].get('models') else 1)" \
          || { echo "[pricing:update] FAIL: fetched file lacks anthropic provider" >&2; exit 1; }
        # Attestation: record sha256 alongside the snapshot so wheel integrity
        # can be verified against the source-of-truth committed here.
        new_sha="$(sha256sum "$tmp" | awk '{print $1}')"
        old_sha="$(cat "$target.sha256" 2>/dev/null || echo none)"
        if [ "$new_sha" = "$old_sha" ]; then
          echo "[pricing:update] no change ($new_sha)"
          exit 0
        fi
        mv "$tmp" "$target"
        echo "$new_sha" > "$target.sha256"
        trap - EXIT
        echo "[pricing:update] updated"
        echo "  was: $old_sha"
        echo "  now: $new_sha"
        echo "  size: $(wc -c < "$target") bytes, $(jq 'keys | length' "$target") providers, $(jq '[.[] | .models // {} | keys[]] | length' "$target") models"

  pricing:verify:
    desc: "Verify the bundled pricing snapshot matches its recorded sha256"
    cmds:
      - |
        target="src/lola_eval/_data/pricing/models.json"
        recorded="$(cat "$target.sha256")"
        actual="$(sha256sum "$target" | awk '{print $1}')"
        if [ "$recorded" != "$actual" ]; then
          echo "[pricing:verify] FAIL: $target sha256 mismatch" >&2
          echo "  recorded: $recorded" >&2
          echo "  actual:   $actual"   >&2
          exit 1
        fi
        echo "[pricing:verify] OK ($actual)"

  calibration:update:
    desc: "Merge ok rows from a runs.db into the bundled calibration JSONL"
    vars:
      SRC: '{{.SRC | default ".lola-eval/out/runs.db"}}'
    cmds:
      - "{{.VENV_PY}} -m lola_eval.calibration_update --src {{.SRC}}"
      - task: calibration:verify

  calibration:verify:
    desc: "Verify the bundled calibration JSONL: sha256 + schema"
    cmds:
      - "{{.VENV_PY}} -m lola_eval.calibration_verify"

  docs:verify:
    desc: "Live-verify documented commands against examples/default/ (see tests/python/docs_snippets.py)"
    cmds:
      - "{{.VENV_PY}} -m pytest tests/python/test_docs_snippets.py -v"

  clean:
    desc: Remove regenerable build/cache artifacts (does not touch source or .lola-eval state)
    cmds:
      - rm -rf build/ dist/ .pytest_cache/ src/lola_eval/__pycache__ src/lola_eval/cli/__pycache__

  version-bump:
    desc: "Bump the Python package version (pyproject + uv.lock + docs). Arg: major|minor|patch|X.Y.Z (default minor)"
    # Pass the argument through the environment, not via {{...}} interpolation:
    # Task splices template values into the script text, so an arg like
    # '$(cmd)' would be evaluated by the shell. As an env value it stays a
    # literal string that parameter expansion never re-evaluates.
    env:
      BUMP: '{{.CLI_ARGS | default "minor"}}'
    cmds:
      - |
        set -euo pipefail
        old="$(uv version --short)"
        case "$BUMP" in
          major|minor|patch) uv version --bump "$BUMP" ;;
          *) uv version "$BUMP" ;;
        esac
        new="$(uv version --short)"
        '{{.VENV_PY}}' -m lola_eval.version_docs "$old" "$new" README.md docs/walkthrough.md
        echo "version-bump: $old -> $new"

  version-bump:js:
    desc: "Bump the JS providers package version (package.json + package-lock.json). Arg: major|minor|patch|X.Y.Z (required)"
    # Argument passed via the environment, not interpolation — see version-bump.
    env:
      BUMP: '{{.CLI_ARGS}}'
    cmds:
      - |
        set -euo pipefail
        if [ -z "${BUMP:-}" ]; then
          echo "usage: task version-bump:js -- <major|minor|patch|X.Y.Z>" >&2
          exit 1
        fi
        npm version "$BUMP" --no-git-tag-version
