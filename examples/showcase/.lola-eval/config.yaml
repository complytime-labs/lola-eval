# examples/showcase/.lola-eval/config.yaml
# Showcase example: exercises every harness feature simultaneously.
# Mode 1 (in-repo) — no `packs:` block. Profiles live under
# .lola-eval/profiles/. calculate_baseline: true adds an exec_mode=none
# pass alongside the exec_mode=project pass for each cell.
#
# Cell count: 3 models × 4 test_sets × 5 profiles × 2 baselines = 120
# (baseline doubles every cell: project-pass + none-pass).
#
# Run:
#   lola-eval test --config examples/showcase/.lola-eval/config.yaml --estimate-cost
#   lola-eval test --config examples/showcase/.lola-eval/config.yaml

targets:
  - cli: claude-code
    models:
      - claude-opus-4-7
      - claude-sonnet-4-6
      - claude-haiku-4-5-20251001

calculate_baseline: true          # exec_mode=none pass alongside exec_mode=project

threshold:
  mode: absolute
  tolerance: 0.05
  timeout_is_failure: true

concurrency: 4

judges:
  - {cli: claude-code, model: claude-sonnet-4-6}
  - {cli: claude-code, model: claude-haiku-4-5-20251001}

aggregation: mean
disagreement_threshold: 0.15

profiles:
  - none
  - small
  - medium
  - large
  - combined

ci:
  junit_xml: true
  github_summary: true
  html_report: true
